openapi: 3.0.0

info:
  title: Projects API
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:

  /projects:

    get:
      summary: Get all projects

      responses:

        '200':
          description: Projects fetched successfully

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/Project'

        '500':
          description: Internal server error

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new project

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: '#/components/schemas/Project'

      responses:

        '201':
          description: Project created successfully

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/Project'

        '400':
          description: Invalid request data

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}:

    get:
      summary: Get project by ID

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: integer

      responses:

        '200':
          description: Project found

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/Project'

        '404':
          description: Project not found

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/status:

    patch:
      summary: Update project status

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: integer

      requestBody:
        required: true

        content:
          application/json:

            schema:
              type: object

              properties:

                status:
                  type: string

      responses:

        '200':
          description: Status updated successfully

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/Project'

        '404':
          description: Project not found

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  schemas:

    Project:

      type: object

      required:
        - id
        - name

      properties:

        id:
          type: integer

        name:
          type: string

        status:
          type: string

    Task:

      type: object

      required:
        - id
        - title

      properties:

        id:
          type: integer

        title:
          type: string

        completed:
          type: boolean

    ErrorResponse:

      type: object

      required:
        - message

      properties:

        message:
          type: string
